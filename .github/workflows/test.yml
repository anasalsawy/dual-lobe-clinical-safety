name: test

on:
  push:
  pull_request:

jobs:
  pytest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: python -m pip install --upgrade pip
      - run: pip install -e . pytest pytest-asyncio
      - run: pytest -q
      - name: Deterministic privacy audit
        run: python evaluation/privacy_audit.py --out /tmp/privacy_audit.json
